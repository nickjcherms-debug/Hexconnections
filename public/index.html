<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Hexagonal thinking boards for classrooms: students arrange vocabulary hexagons and explain every connection, with optional Depth and Complexity icons.">
<meta name="hex-connections-build" content="4.6.1">
<title>Hex Connections</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<script>try{var hxa=JSON.parse(localStorage.getItem('hx-appearance')||'{}');if(hxa.theme&&hxa.theme!=='system')document.documentElement.setAttribute('data-theme',hxa.theme);if(hxa.text==='large')document.documentElement.setAttribute('data-text','large')}catch(e){}</script>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,-apple-system,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style id="hx-style">
/* Layout: a working honeycomb board with a tile tray beside it (stacked on phones); teacher side is a two-pane setup + dashboard. */
:root{
  --paper:#F1F7FF; --panel:#FFFFFF; --ink:#1E2A47; --muted:#55627F; --line:#D2DEEF; --cell:#DCE7F6;
  --tile:#FFFFFF; --tile-edge:#AFC3E2; --honey:#FFC229; --honey-soft:#FFF0BF; --honey-ink:#7A4E00;
  --teal:#08756E; --teal-soft:#D3F4EF; --danger:#B83A24; --ok:#1E9A55; --shadow:rgba(30,42,71,.13);
  --blue:#2F6FED; --on-blue:#FFFFFF;
  --t1:#E1EFFF; --t2:#FFE6DE; --t3:#E2F7E8; --t4:#EEE6FF; --t5:#DDF6F5; --t6:#FFE5F0;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme]){
  --paper:#0F1730; --panel:#17213F; --ink:#EAF0FF; --muted:#A5B2D1; --line:#2B3962; --cell:#1F2B50;
  --tile:#1D2A4F; --tile-edge:#3C5088; --honey:#FFC94D; --honey-soft:#3E3414; --honey-ink:#FFE08A;
  --teal:#3FD0C4; --teal-soft:#12393A; --danger:#FF8A73; --ok:#5BD68A; --shadow:rgba(0,0,0,.45);
  --blue:#78A6FF; --on-blue:#0B1430;
  --t1:#20325E; --t2:#43293A; --t3:#1E3D35; --t4:#2F2A5A; --t5:#183D48; --t6:#42284A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1730; --panel:#17213F; --ink:#EAF0FF; --muted:#A5B2D1; --line:#2B3962; --cell:#1F2B50;
  --tile:#1D2A4F; --tile-edge:#3C5088; --honey:#FFC94D; --honey-soft:#3E3414; --honey-ink:#FFE08A;
  --teal:#3FD0C4; --teal-soft:#12393A; --danger:#FF8A73; --ok:#5BD68A; --shadow:rgba(0,0,0,.45);
  --blue:#78A6FF; --on-blue:#0B1430;
  --t1:#20325E; --t2:#43293A; --t3:#1E3D35; --t4:#2F2A5A; --t5:#183D48; --t6:#42284A; color-scheme:dark}

html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
#root{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:18px 14px;border-bottom:3px solid transparent;border-image:linear-gradient(90deg,var(--blue),var(--teal),var(--honey),var(--danger)) 1;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{flex:none}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:-.01em;margin:0;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:.8rem;letter-spacing:.04em;text-transform:uppercase}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.8rem;color:var(--muted);background:var(--panel)}
.chip.ok{color:var(--ok);border-color:currentColor}
h2{font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1.15;letter-spacing:-.015em;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:1.05rem;margin:0;text-wrap:balance}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:.9rem;line-height:1.2;min-height:38px;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.btn.honey{background:var(--honey);color:#2A1B00;border-color:var(--honey)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--danger);border-color:currentColor;background:transparent}
.btn.danger-solid{background:var(--danger);color:var(--panel);border-color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:30px;padding:4px 10px;font-size:.82rem}
:focus-visible{outline:3px solid var(--honey);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
label.fld{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.85rem;min-width:0}
label.fld span.hint,.hint{font-weight:400;color:var(--muted);font-size:.8rem}
input[type=text],input[type=email],input[type=password],input[type=number],textarea,select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;width:100%;font-weight:400;font-size:.95rem}
input[type=file]{max-width:100%;font-size:.85rem}
textarea{resize:vertical;min-height:90px;line-height:1.45}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.toast-act{margin-left:12px;background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:3px 10px;font-weight:700;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:700;font-size:.9rem;box-shadow:0 8px 24px var(--shadow);z-index:60;max-width:min(92vw,520px);text-align:center}

/* ---------- Student board ---------- */
.act-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;margin-bottom:16px}
.act-head .ins{max-width:65ch;margin:6px 0 0;color:var(--muted)}
.who{display:flex;gap:8px;flex-wrap:wrap}
.who input{width:170px}
.who input.per{width:110px}
.status{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:14px}
.stat{display:flex;align-items:baseline;gap:6px}
.stat b{font-family:var(--f-mono);font-size:1.1rem}
.stat.done b{color:var(--ok)}
.status .row{margin-left:auto}
.play{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
.board{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.board-scroll{overflow:auto;max-height:76vh;overscroll-behavior:contain}
.board-svg{display:block;width:100%;height:auto;max-height:76vh;touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none}
.board-svg.zoomed{max-height:none}
.board-tools{position:absolute;top:8px;right:8px;display:flex;gap:4px;z-index:2;flex-wrap:wrap;justify-content:flex-end}
.board-tools .btn{min-height:32px;min-width:32px;padding:4px 9px;background:var(--panel);box-shadow:0 1px 3px var(--shadow)}
.board-tools .zl{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);align-self:center;padding:0 2px;background:var(--panel);border-radius:6px}
.bprev{border:1px solid var(--line);border-radius:10px;background:var(--paper);max-width:340px}
.bprev .board-svg{max-height:220px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:6px;padding:6px 10px;cursor:pointer;font-size:.86rem;font-weight:700;border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg label:has(input:checked){background:var(--honey-soft)}
.seg input{accent-color:var(--honey)}
.cell{fill:var(--paper);stroke:var(--cell);stroke-width:1.5}
.cell.hot{fill:var(--honey-soft);stroke:var(--honey);stroke-width:2.5}
.hexg{cursor:grab;touch-action:none}
.hexg .hx{fill:var(--tile);stroke:var(--tile-edge);stroke-width:1.5}
.hexg.dc .hx{fill:var(--honey-soft);stroke:var(--honey);stroke-width:2.5}
.hexg.locked .hx{stroke:var(--teal);stroke-width:2}
.hexg.sel .hx{stroke:var(--blue);stroke-width:4}
.hexg.c1 .hx,.tile.c1{fill:var(--t1);background:var(--t1)}
.hexg.c2 .hx,.tile.c2{fill:var(--t2);background:var(--t2)}
.hexg.c3 .hx,.tile.c3{fill:var(--t3);background:var(--t3)}
.hexg.c4 .hx,.tile.c4{fill:var(--t4);background:var(--t4)}
.hexg.c5 .hx,.tile.c5{fill:var(--t5);background:var(--t5)}
.hexg.c6 .hx,.tile.c6{fill:var(--t6);background:var(--t6)}
.hexg.dragging{opacity:.25}
.hexg .num{font-family:var(--f-mono);font-size:10.5px;font-weight:700;fill:var(--muted)}
.hexg .term{font-family:var(--f-body);font-weight:700;fill:var(--ink)}
.hexg .lk{fill:var(--teal)}
.glyph{fill:none;stroke:var(--honey-ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.edge{stroke:var(--teal);stroke-width:5;stroke-linecap:round}
.badge{cursor:pointer}
.badge circle{fill:var(--teal);stroke:var(--panel);stroke-width:2}
.badge text{font-family:var(--f-mono);font-weight:700;font-size:10px;fill:var(--panel)}
.badge:hover circle,.badge:focus-visible circle{fill:var(--honey)}
.board-legend{font-size:.75rem;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;padding:6px 12px;border-top:1px solid var(--line);background:var(--panel)}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.tray{display:flex;flex-wrap:wrap;gap:4px 6px;padding:10px;border:2px dashed var(--line);border-radius:12px;min-height:120px;align-content:flex-start;background:var(--panel)}
.tray.over{border-color:var(--honey);background:var(--honey-soft)}
.tray-empty{color:var(--muted);font-size:.85rem;padding:6px}
.tile-w{filter:drop-shadow(0 1px 0 var(--tile-edge)) drop-shadow(0 2px 3px var(--shadow))}
.tile{width:78px;aspect-ratio:0.866;max-width:100%;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--tile);border:0;padding:14px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;text-align:center}
.tile .n{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);font-weight:700}
.tile .t{font-weight:700;font-size:.72rem;line-height:1.15;overflow-wrap:anywhere;hyphens:auto}
.tile .t.l1{font-size:.68rem}
.tile .t.l2{font-size:.62rem;letter-spacing:-.01em}
.tile.dc{background:var(--honey-soft)}
.tile.dc .t{font-size:.66rem}
.tile.dc svg{width:18px;height:18px}
.tile.sel{box-shadow:inset 0 0 0 4px var(--blue)}
.drag-ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.06);filter:drop-shadow(0 8px 14px var(--shadow))}
.detail{display:flex;flex-direction:column;gap:10px}
.detail .def{margin:0;color:var(--ink)}
.clist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.clist li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;font-size:.88rem}
.clist li.btnrow{display:block}
.cbtn{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:6px;cursor:pointer;font-size:.88rem}
.cbtn:hover{border-color:var(--line);background:var(--paper)}
.cnum{font-family:var(--f-mono);font-weight:700;font-size:.75rem;background:var(--teal);color:var(--panel);border-radius:999px;padding:1px 7px;margin-top:2px}
.why{color:var(--muted);overflow-wrap:anywhere}
.banner{padding:10px 14px;border-radius:10px;background:var(--t1);color:var(--ink);margin-bottom:14px;font-size:.92rem}
.banner.warn{background:var(--honey-soft)}

/* ---------- Activity picker ---------- */
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:16px}
.pick{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.pick:hover{border-color:var(--honey)}

/* ---------- Modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,16,17,.5);z-index:40;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--panel);border-radius:14px;max-width:560px;width:100%;max-height:100%;overflow:auto;padding:20px;box-shadow:0 20px 50px var(--shadow);display:flex;flex-direction:column;gap:14px}
.modal.wide{max-width:980px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch}
.pt{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--paper);min-width:0}
.pt.dc{background:var(--honey-soft);border-color:transparent}
.pt b{display:block}
.pt p{margin:4px 0 0;font-size:.82rem;color:var(--muted)}
.pt.dc p{color:var(--ink)}
.pair .link{align-self:center;font-family:var(--f-mono);font-weight:700;color:var(--teal)}
.lens{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--honey-soft)}
.lens svg{flex:none;width:28px;height:28px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.count{font-size:.8rem;color:var(--muted)}
.count.ok{color:var(--ok)}

/* ---------- Teacher ---------- */
.teach{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.alist{display:flex;flex-direction:column;gap:6px}
.aitem{text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.aitem:hover{background:var(--panel);border-color:var(--line)}
.aitem.on{background:var(--panel);border-color:var(--blue);box-shadow:inset 3px 0 0 var(--blue)}
.aitem b{font-size:.95rem}
.aitem span{font-size:.8rem;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 16px}
.tab{border:0;background:transparent;padding:8px 12px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--blue)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.dcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 12px}
.dcopt{display:flex;gap:8px;align-items:center;font-size:.88rem;padding:6px 8px;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.dcopt:has(input:checked){background:var(--honey-soft);border-color:var(--honey)}
.dcopt svg{flex:none;width:20px;height:20px}
.vt{display:flex;flex-direction:column;gap:6px}
.vt-head,.vt-row{display:grid;grid-template-columns:48px minmax(0,1fr) minmax(0,2fr) 96px;gap:8px;align-items:center}
.vt-head{font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.vt-num{font-family:var(--f-mono);font-weight:700;font-size:.8rem;color:var(--ink);text-align:center;border-radius:8px;padding:8px 0;background:var(--paper);border:1px dashed var(--line)}
.vt-num.c1{background:var(--t1);border:0}.vt-num.c2{background:var(--t2);border:0}.vt-num.c3{background:var(--t3);border:0}.vt-num.c4{background:var(--t4);border:0}.vt-num.c5{background:var(--t5);border:0}.vt-num.c6{background:var(--t6);border:0}
.vt-del{min-height:36px;padding:4px 10px;border:1.5px solid var(--danger);background:var(--panel);color:var(--danger);font-size:.85rem;font-weight:700;gap:5px;justify-self:stretch;white-space:nowrap}
.vt-del .ic{font-size:1rem;line-height:1}
.vt-del:hover{background:var(--danger);color:var(--panel)}
.vt-del[disabled]{opacity:1;border-color:var(--line);color:var(--muted);background:transparent;cursor:not-allowed}
.vt-del[disabled]:hover{background:transparent;color:var(--muted)}
.vt-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (max-width:600px){
  .vt-head{display:none}
  .vt-row{grid-template-columns:48px minmax(0,1fr) auto;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .vt-row .vt-num{grid-row:1 / 3}
  .vt-row .vt-def{grid-column:2;grid-row:2}
  .vt-row .vt-del{grid-column:3;grid-row:1}
}
.gate{max-width:460px;margin:24px auto 0;display:flex;flex-direction:column;gap:14px}
.gate .panel{display:flex;flex-direction:column;gap:12px}
#st-code{font-family:var(--f-mono);font-size:1.5rem;letter-spacing:.18em;text-transform:uppercase;text-align:center;padding:12px}
.err{margin:0;color:var(--danger);font-weight:700}
.codebig{font-family:var(--f-mono);font-size:1.5rem;font-weight:700;letter-spacing:.1em;color:var(--ink);background:var(--t1);border-radius:10px;padding:6px 14px}
.cls-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.cls-card{display:flex;flex-direction:column;gap:10px}
.cls-card.off{background:var(--paper)}
.cls-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.chip.late{color:var(--danger);border-color:currentColor}
.chip.due{color:var(--ink);background:var(--honey-soft);border-color:transparent}
.side-h{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.btn.ai{background:var(--t4);border-color:transparent;color:var(--ink)}
.gen-list{display:flex;flex-direction:column;gap:4px;max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px}
.gen-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:6px 8px;border-radius:8px;cursor:pointer}
.gen-item:hover{background:var(--paper)}
.gen-item b{display:block}
.gen-item span{color:var(--muted);font-size:.86rem}
.thinking{display:flex;gap:10px;align-items:center;color:var(--muted)}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--blue);animation:pulse 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--paper)}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.savebar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:var(--ink);color:var(--paper);margin-top:16px;box-shadow:0 8px 24px var(--shadow)}
.savebar .btn{background:var(--honey);border-color:var(--honey);color:#2A1B00}

/* ===== 4.4: themes, readable sizes, and layouts that fit each screen ===== */
:root[data-theme="contrast"]{
  --paper:#FFFFFF; --panel:#FFFFFF; --ink:#000000; --muted:#222222; --line:#1A1A1A; --cell:#6B6B6B;
  --tile:#FFFFFF; --tile-edge:#000000; --honey:#FFC229; --honey-soft:#FFE07A; --honey-ink:#000000;
  --teal:#00574F; --teal-soft:#C6F0EA; --danger:#9E0016; --ok:#06612A; --shadow:rgba(0,0,0,.28);
  --blue:#0033B3; --on-blue:#FFFFFF;
  --t1:#D3E4FF; --t2:#FFD6C7; --t3:#CDF0D8; --t4:#E2D5FF; --t5:#C9EFEC; --t6:#FFD2E6; color-scheme:light}
:root[data-theme="contrast"] .btn,:root[data-theme="contrast"] .panel,:root[data-theme="contrast"] .chip,:root[data-theme="contrast"] input,:root[data-theme="contrast"] select,:root[data-theme="contrast"] textarea,:root[data-theme="contrast"] .tray{border-width:2px;border-color:#000}
:root[data-theme="contrast"] .btn.primary{border-color:var(--blue)}
:root[data-theme="contrast"] a{text-decoration:underline}
:root[data-theme="contrast"] :focus-visible{outline:3px solid #000;box-shadow:0 0 0 6px #FFC229}
:root[data-theme="contrast"] .hexg .hx{stroke-width:2.5}
:root[data-text="large"]{font-size:18px}
:root[data-text="large"] body{font-size:17px}
a.btn,a.nav-link,a.menu-item,.btn{text-decoration:none}
:root[data-theme="contrast"] a.btn{text-decoration:none}
h2,h3,.brand h1,.aitem b,.act-head h2,.modal h3{overflow-wrap:anywhere}
.panel{border-radius:14px}
.page-title{margin-bottom:6px}
.back-link{align-self:flex-start;margin:-6px 0 6px -8px}
.board-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:-6px 0 6px}
.board-top>.btn{margin:0 0 0 -8px}
.board-top .row{gap:6px}
.status-chip{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;background:var(--t1);color:var(--ink)}
.status-chip.done{background:var(--teal-soft);color:var(--teal)}
.status-chip.late{background:var(--honey-soft);color:var(--honey-ink)}
.stu-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.stu-grid .code-col{display:flex;flex-direction:column;gap:12px}
.stu-grid .code-col .row input{flex:1;min-width:0}
.assign-card{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.assign-card h3{font-size:1.1rem}
.appearance-pop .menu-item.on::before{content:'✓ ';font-weight:700}
.appearance-btn{min-width:38px}
/* Board fits the screen height; the tray column stays in view on wide screens. */
.board-scroll,.board-svg{max-height:max(360px,calc(100vh - 230px))}
.board-svg.zoomed{max-height:none}
@media (min-width:901px){
  .play .side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding-right:2px}
}
@media (min-width:1600px){#root{max-width:1440px}.play{grid-template-columns:minmax(0,1fr) 340px}}

/* Phones and tablets: the hexagon tray docks to the bottom of the screen so it is
   always within reach while working on the board. */
@media (max-width:900px){
  .play .side>.stack:last-child{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -6px 18px var(--shadow);padding:6px max(12px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));gap:2px}
  .play .side>.stack:last-child>.row span.muted{display:none}
  .play .side>.stack:last-child .tray{flex-wrap:nowrap;overflow-x:auto;min-height:0;padding:4px 6px;border-width:1px;scroll-snap-type:x proximity}
  .play .side>.stack:last-child .tile-w{flex:none;scroll-snap-align:start}
  .play .side>.stack:last-child .tray-empty{padding:10px 6px}
  #root:has(.play){padding-bottom:160px}
  .stu-grid{grid-template-columns:minmax(0,1fr)}
  .stu-grid .code-col{order:-1}
}

.grader{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.grader-board .board-svg{max-height:62vh}
.grader-side{display:flex;flex-direction:column;gap:10px;max-height:66vh;overflow:auto;padding-right:4px}
.gr-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.gr-row{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.gr-head{display:flex;gap:8px;align-items:baseline}
.gr-why{margin:0;color:var(--ink)}
.gr-note{width:100%;min-height:44px}
.score-seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.score-btn{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.84rem;cursor:pointer;min-height:36px}
.score-btn.on.s0{background:#FDE2DC;border-color:var(--danger);color:#7A1A0B}
.score-btn.on.s1{background:var(--honey-soft);border-color:var(--honey);color:var(--honey-ink)}
.score-btn.on.s2{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.bank-menu{align-self:flex-start}
.bank-menu .menu-pop{left:0;right:auto;max-width:min(420px,calc(100vw - 32px))}
.bank-menu .menu-item{white-space:normal;text-align:left}
.bank-chip{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:.8rem;color:var(--muted);cursor:pointer;min-height:32px}
.bank-chip:hover{border-color:var(--blue);color:var(--ink)}
.grader-foot{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.grader-foot textarea{width:100%}
#gr-grade{max-width:140px}
.feedback-panel{border-left:5px solid var(--teal);display:flex;flex-direction:column;gap:8px;margin:8px 0 12px}
.fb-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.fb-list li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.score-pill{border-radius:999px;padding:1px 9px;font-size:.8rem;font-weight:700}
.score-pill.s0{background:#FDE2DC;color:#7A1A0B}.score-pill.s1{background:var(--honey-soft);color:var(--honey-ink)}.score-pill.s2{background:var(--teal-soft);color:var(--teal)}
.post-tools{margin:4px 0 8px}
.ins-stats,.present-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.ins-stat{background:var(--t1);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.ins-stat b{font-family:var(--f-display);font-size:1.6rem;line-height:1.1}
.ins-stat span{color:var(--muted);font-size:.85rem}
.ins-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.bars li{display:grid;grid-template-columns:minmax(80px,1fr) 2fr auto;gap:8px;align-items:center}
.bar{height:10px;background:var(--t1);border-radius:999px;overflow:hidden}
.bar-fill{display:block;height:100%;background:var(--teal);border-radius:999px}
.bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-pairs{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.present{position:fixed;inset:0;z-index:100;background:var(--paper);color:var(--ink);overflow:auto;padding:24px clamp(16px,4vw,48px);display:flex;flex-direction:column;gap:18px}
.present-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.present-top h2{font-size:clamp(1.8rem,3.5vw,2.8rem)}
.present-code{display:flex;flex-direction:column;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:8px 18px}
.present-code b{font-family:var(--f-mono);font-size:clamp(1.8rem,3.5vw,2.6rem);letter-spacing:.12em}
.present-code span{color:var(--muted);font-size:.95rem}
.present-stats .ins-stat b{font-size:clamp(2rem,4vw,3.2rem)}
.present-net{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.net-svg{width:100%;max-height:52vh;display:block}
.net-edge{stroke:var(--teal);stroke-linecap:round}
.net-node polygon{fill:var(--t1);stroke:var(--tile-edge);stroke-width:1.5}
.net-node text{font-family:var(--f-body);font-weight:700;font-size:12px;fill:var(--ink)}
.present-spot{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.spot blockquote{margin:0;font-size:clamp(1.3rem,2.6vw,2rem);line-height:1.35;max-width:60ch}
.spot-pair{margin:0;font-weight:700;color:var(--teal)}
.privacy{max-width:760px}
.privacy ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
@media (max-width:900px){.grader,.ins-grid{grid-template-columns:minmax(0,1fr)}.grader-side{max-height:none}}

function csvCell(v){ v = v == null ? '' : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }

function parseCSV(text){
  var rows=[], row=[], f='', q=false;
  text = (text||'').replace(/^﻿/,'');
  for (var i=0;i<text.length;i++){
    var c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if (c === '"') q = true;

  return rows.filter(function(r){ return r.some(function(x){ return x.trim(); }); });
}

    var t = l, d = '';
    for (var s=0;s<seps.length;s++){ var k = l.indexOf(seps[s]); if (k > 0){ t = l.slice(0,k).trim(); d = l.slice(k+seps[s].length).trim(); break; } }

/* ---------------- geometry ---------------- */
/* Axial coordinates never change; "flat" is the pointy layout rotated 30 degrees, so turning the board keeps every connection. */
var C30 = Math.cos(Math.PI/6), S30 = 0.5, MAXD = 20;
var SHAPES = [
  {k:'hexagon', name:'Honeycomb', hint:'A round hexagon of cells'},
  {k:'wide', name:'Wide', hint:'Landscape rectangle, good for timelines and chains'},
  {k:'tall', name:'Tall', hint:'Portrait rectangle, good for hierarchies and flows'},
  {k:'open', name:'Open', hint:'Starts with extra room and grows wherever students build'}
];
var ROOM = [ {k:'snug', name:'Snug', f:2}, {k:'roomy', name:'Roomy', f:4}, {k:'spacious', name:'Spacious', f:6}, {k:'expansive', name:'Expansive', f:9} ];
function boardOf(act){ var b = act.board || {}; return { shape: b.shape || 'hexagon', size: b.size || 'roomy', orient: b.orient === 'flat' ? 'flat' : 'pointy', rotate: b.rotate !== false }; }
function hexDist(q,r){ return Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r)); }
function onBoardLimit(q,r){ return hexDist(q,r) <= MAXD; }
function center(q,r,o){ var x = R*SQ3*(q + r/2), y = R*1.5*r; return o === 'flat' ? [x*C30 - y*S30, x*S30 + y*C30] : [x, y]; }
function hexPts(cx,cy,rad,o){ var off = o === 'flat' ? 0 : -30, p=[]; for (var i=0;i<6;i++){ var a = Math.PI/180*(60*i+off); p.push((cx+rad*Math.cos(a)).toFixed(1)+','+(cy+rad*Math.sin(a)).toFixed(1)); } return p.join(' '); }
/* every cell on the board: the teacher's base shape plus room around anything already placed, so building at an edge grows the board */
function boardCells(act, place, o){
  var b = boardOf(act), n = Math.max(hexList(act).length, 1);
  var f = (ROOM.filter(function(x){ return x.k === b.size; })[0] || ROOM[1]).f;
  var target = Math.max(Math.round(n * f), 61);
  var set = {}, list = [];
  function addc(q,r){ var k = q+','+r; if (!set[k] && onBoardLimit(q,r)){ set[k] = 1; list.push([q,r]); } }
  var q, r;
  if (b.shape === 'open'){ for (q=-4;q<=4;q++) for (r=-4;r<=4;r++) if (hexDist(q,r) <= 4) addc(q,r); }
  else if (b.shape === 'hexagon'){ var N = 2; while (1 + 3*N*(N+1) < target && N < MAXD) N++; for (q=-N;q<=N;q++) for (r=-N;r<=N;r++) if (hexDist(q,r) <= N) addc(q,r); }
  else {
    var area = target * 1.15 * 2.598 * R * R, ar = 1.75, W = Math.sqrt(area*ar)/2, Hh = W/ar;
    if (b.shape === 'tall'){ var t = W; W = Hh; Hh = t; }
    for (q=-MAXD;q<=MAXD;q++) for (r=-MAXD;r<=MAXD;r++){ if (!onBoardLimit(q,r)) continue; var c = center(q,r,o); if (Math.abs(c[0]) <= W + 1 && Math.abs(c[1]) <= Hh + 1) addc(q,r); }
  }
  var grow = b.shape === 'open' ? 2 : 1;
  Object.keys(place||{}).forEach(function(k){ var p = place[k]; for (var dq=-grow;dq<=grow;dq++) for (var dr=-grow;dr<=grow;dr++) if (hexDist(dq,dr) <= grow) addc(p[0]+dq, p[1]+dr); });
  return { list:list, set:set };
}
function pixToHex(x,y,o){
  if (o === 'flat'){ var x2 = x*C30 + y*S30, y2 = -x*S30 + y*C30; x = x2; y = y2; }
  var q = (SQ3/3*x - y/3)/R, r = (2/3*y)/R, s = -q-r;
  var rq = Math.round(q), rr = Math.round(r), rs = Math.round(s);
  var dq = Math.abs(rq-q), dr = Math.abs(rr-r), ds = Math.abs(rs-s);
  if (dq > dr && dq > ds) rq = -rr-rs; else if (dr > ds) rr = -rq-rs;
  return [rq, rr];
}
function wrapText(text, maxC, maxLines){
  var out = [], cur = '';
  text.split(/\s+/).forEach(function(w){
    while (w.length > maxC){ if (cur){ out.push(cur); cur=''; } out.push(w.slice(0,maxC-1)+'-'); w = w.slice(maxC-1); }
    if (!cur) cur = w; else if ((cur+' '+w).length <= maxC) cur += ' ' + w; else { out.push(cur); cur = w; }
  });
  if (cur) out.push(cur);
  if (out.length > maxLines){ out = out.slice(0,maxLines); out[maxLines-1] = out[maxLines-1].slice(0,maxC-1) + '…'; }
  return out;
}
function wrapTerm(term){
  var l = wrapText(term, 11, 9);
  if (l.length > 3) return { lines: wrapText(term, 14, 4), size: 10.5 };
  return { lines: l, size: 12.5 };
}

/* positions -> adjacency */
function posIndex(place){ var m = {}; Object.keys(place||{}).forEach(function(n){ m[place[n][0]+','+place[n][1]] = +n; }); return m; }
function neighborsOf(n, place){
  var p = place[n]; if (!p) return [];
  var idx = posIndex(place), out = [];
  DIRS.forEach(function(d){ var m = idx[(p[0]+d[0])+','+(p[1]+d[1])]; if (m) out.push(m); });
  return out;
}
function adjacentPairs(place){
  var idx = posIndex(place), seen = {}, out = [];
  Object.keys(place).forEach(function(n){
    n = +n; var p = place[n];
    DIRS.forEach(function(d){ var m = idx[(p[0]+d[0])+','+(p[1]+d[1])]; if (m){ var k = pkey(n,m); if (!seen[k]){ seen[k]=1; out.push([Math.min(n,m),Math.max(n,m)]); } } });
  });
  return out;
}
/* justified, currently-touching connections, numbered by when they were made */
function activeConns(place, conns){
  return adjacentPairs(place).map(function(pr){ var c = conns[pkey(pr[0],pr[1])]; return c && c.why ? {a:pr[0], b:pr[1], why:c.why, at:c.at||0} : null; })
    .filter(Boolean).sort(function(x,y){ return x.at - y.at || x.a - y.a || x.b - y.b; })
    .map(function(c,i){ c.num = i+1; return c; });
}

/* ---------------- board renderer (shared by student + teacher review) ---------------- */
function boardSVG(act, place, conns, opt){
  opt = opt || {};
  var H = hexMap(act), o = opt.orient || boardOf(act).orient;
  var cells = opt.cells || boardCells(act, place, o);
  var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  cells.list.forEach(function(cr){ var c = center(cr[0],cr[1],o); minX = Math.min(minX,c[0]); maxX = Math.max(maxX,c[0]); minY = Math.min(minY,c[1]); maxY = Math.max(maxY,c[1]); });
  var pad = R + 8;
  var svg = sv('svg',{class:'board-svg',viewBox:(minX-pad).toFixed(1)+' '+(minY-pad).toFixed(1)+' '+(maxX-minX+2*pad).toFixed(1)+' '+(maxY-minY+2*pad).toFixed(1),role:'img','aria-label':'Hexagon board for ' + act.title});
  var g = sv('g'); svg.appendChild(g);
  var occ = posIndex(place);
  cells.list.forEach(function(cr){
    var q = cr[0], r = cr[1], c = center(q,r,o);
    var poly = sv('polygon',{class:'cell',points:hexPts(c[0],c[1],R-1,o),'data-cell':q+','+r});
    if (opt.onCell && !occ[q+','+r]) poly.addEventListener('click', function(){ opt.onCell(q,r); });
    g.appendChild(poly);
  });
  var live = activeConns(place, conns);
  var locked = {};
  live.forEach(function(cn){ locked[cn.a]=1; locked[cn.b]=1; });
  Object.keys(place).forEach(function(n){
    n = +n; var h = H[n]; if (!h) return;
    var c = center(place[n][0], place[n][1], o);
    var gg = sv('g',{class:'hexg' + (h.kind==='dc'?' dc':' c'+h.ci) + (locked[n]?' locked':'') + (opt.selected===n?' sel':''), 'data-n':n, tabindex: opt.interactive ? 0 : null, role: opt.interactive ? 'button':null, 'aria-label': h.label+' '+h.name + (locked[n]?' (locked)':'')});
    gg.appendChild(sv('polygon',{class:'hx',points:hexPts(c[0],c[1],R-3,o)}));
    gg.appendChild(sv('text',{class:'num','text-anchor':'middle',x:c[0],y:c[1]-R+20,text:h.label}));
    if (h.kind === 'dc'){
      gg.appendChild(sv('g',{transform:'translate('+(c[0]-9)+','+(c[1]-22)+') scale(0.75)'}, sv('path',{class:'glyph',d:DC[DCI[h.key]].d})));
      var dl = wrapText(h.name, 12, 3);
      var dt = sv('text',{class:'term','text-anchor':'middle','font-size':9.5});
      dl.forEach(function(line,i){ dt.appendChild(sv('tspan',{x:c[0],y:(c[1]+8+i*10.5).toFixed(1),text:line})); });
      gg.appendChild(dt);
    } else {
      var wt = wrapTerm(h.name);
      var startY = c[1] + 4 - (wt.lines.length-1)*wt.size*0.55;
      var tx = sv('text',{class:'term','text-anchor':'middle','font-size':wt.size});
      wt.lines.forEach(function(line,i){ tx.appendChild(sv('tspan',{x:c[0],y:(startY + i*wt.size*1.1).toFixed(1),text:line})); });
      gg.appendChild(tx);
    }
    if (locked[n]) {
      var lx = c[0]-4, ly = c[1]+R-20;
      gg.appendChild(sv('rect',{class:'lk',x:lx,y:ly+3,width:8,height:6,rx:1.2}));
      gg.appendChild(sv('path',{d:'M'+(lx+1.6)+' '+(ly+3.5)+'v-1.6a2.4 2.4 0 0 1 4.8 0v1.6',fill:'none',stroke:'var(--teal)','stroke-width':1.4}));
    }
    gg.appendChild(sv('title',{text:h.label+' · '+h.name+(h.def?' — '+h.def:'')}));
    if (opt.onHexDown) gg.addEventListener('pointerdown', function(e){ opt.onHexDown(n, e); });
    if (opt.onHexKey) gg.addEventListener('keydown', function(e){ if (e.key==='Enter'||e.key===' '){ e.preventDefault(); opt.onHexKey(n); } });
    g.appendChild(gg);
  });
  live.forEach(function(cn){
    var A = center(place[cn.a][0],place[cn.a][1],o), B = center(place[cn.b][0],place[cn.b][1],o);
    var mx = (A[0]+B[0])/2, my = (A[1]+B[1])/2, dx = B[0]-A[0], dy = B[1]-A[1], L = Math.hypot(dx,dy);
    var px = -dy/L*R*0.42, py = dx/L*R*0.42;
    g.appendChild(sv('line',{class:'edge',x1:(mx-px).toFixed(1),y1:(my-py).toFixed(1),x2:(mx+px).toFixed(1),y2:(my+py).toFixed(1)}));
    var la = H[cn.a] ? H[cn.a].label : '?', lb = H[cn.b] ? H[cn.b].label : '?';
    var bg = sv('g',{class:'badge',tabindex:0,role:'button','aria-label':'Connection C'+cn.num+': '+la+' to '+lb});
    bg.appendChild(sv('circle',{cx:mx,cy:my,r:11}));
    bg.appendChild(sv('text',{x:mx,y:my+3.5,'text-anchor':'middle',text:'C'+cn.num}));
    bg.appendChild(sv('title',{text:'C'+cn.num+' · '+la+'–'+lb+': '+cn.why}));
    var openIt = function(){ if (opt.onBadge) opt.onBadge(cn); };
    bg.addEventListener('click', openIt);
    bg.addEventListener('keydown', function(e){ if (e.key==='Enter'||e.key===' '){ e.preventDefault(); openIt(); } });
    g.appendChild(bg);
  });
  return svg;
}

/* ---------- drag & drop ---------- */
var drag = null;
function beginDrag(n, e, origin){

  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragUp);
  window.addEventListener('pointercancel', onDragCancel);
}
function endListeners(){ window.removeEventListener('pointermove', onDragMove); window.removeEventListener('pointerup', onDragUp); window.removeEventListener('pointercancel', onDragCancel); }

    if (drag.origin === 'board' && !canMove(drag.n)){ toast(ST.H[drag.n].label + ' is locked. Select it and choose Unlock to move.'); cleanupDrag(); return; }
    drag.moved = true;
    var h = ST.H[drag.n];

    document.body.appendChild(drag.ghost);
    var src = refs.board.querySelector('.hexg[data-n="'+drag.n+'"]'); if (src) src.classList.add('dragging');

  drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
  if (drag.hot){ drag.hot.classList.remove('hot'); drag.hot = null; }
  var ot = overTray(e);
  refs.tray.classList.toggle('over', ot && drag.origin === 'board');
  if (ot) return;
  var p = svgPoint(e.clientX, e.clientY); if (!p) return;
  var hh = pixToHex(p.x, p.y, viewOrient());
  var cell = refs.board.querySelector('[data-cell="'+hh[0]+','+hh[1]+'"]');

}
function onDragUp(e){

  var d = drag;
  if (!d.moved){ cleanupDrag(); select(d.n); return; }
  var ot = overTray(e);
  var p = svgPoint(e.clientX, e.clientY);
  cleanupDrag();
  if (ot){ if (d.origin === 'board') unplace(d.n); else updateStudent(); return; }
  if (!p){ updateStudent(); return; }
  var h = pixToHex(p.x, p.y, viewOrient());
  if (!ST.cells || !ST.cells.set[h[0]+','+h[1]]){ updateStudent(); return; }
  var before = JSON.stringify(ST.d.place[d.n]||null);
  tryPlace(d.n, h[0], h[1]);
  if (JSON.stringify(ST.d.place[d.n]||null) === before) updateStudent();
}

    if(signal && signal.aborted)throw new DOMException('Generation canceled.','AbortError');
    var headers={'Authorization':'Bearer '+idToken};

    return fetch('/api/'+path,{method:body===undefined?'GET':'POST',headers:headers,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store',signal:signal});
  }).then(function(res){return res.text().then(function(raw){

var v40Route=route;
route=function(){
  var h=NAV.hash||'';
  if(GA.ready&&!GA.user){
    if(h==='#signin'||h==='#signup'||PUBLIC_KEYS.test(h)){v40Route();return;}

    ssSet('hx-pending',{type:'route',key:h});

    navReplace('home');PX.routeId++;renderHome();return;
  }
  if(GA.ready&&GA.user&&PX.needsVerify){PX.routeId++;renderVerify();return;}
  if(GA.ready&&GA.user&&PX.loaded&&PX.profile&&PX.profile.role){
    var role=PX.profile.role,p=ssGet('hx-pending');
    if(p&&p.type==='route'){takePending();if(p.key!==h&&(role==='teacher'||!/^#teacher/.test(p.key))){NAV.hash=p.key;return;}}
    if(role==='student'&&(isTeacherHash()||h==='#new'||h==='#teacher/new')){
      toast('That page is for teacher accounts.');navReplace('');PX.routeId++;v40Route();return;
    }

  }

/* ===================== 4.2: each posting is its own assignment with start and due dates =====================
   Dates are chosen when posting (never on the class). Posting the same Hex Space to the
   same class again creates another assignment with its own code and dates. */
var TEACHER_TZ=(function(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'}catch(e){return 'UTC'}})();
function todayLocal(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDay(v){if(!v)return '';try{return new Date(v+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}catch(e){return v}}
function postState(p){
  if(p.status&&p.status!=='PUBLISHED')return {label:'Publication pending',cls:''};
  if(p.open===false)return {label:'Closed',cls:'off'};
  if(p.startAt&&Date.now()<Date.parse(p.startAt))return {label:'Scheduled · opens '+fmtDay(p.start),cls:'sched'};
  if(p.dueAt&&Date.now()>Date.parse(p.dueAt))return {label:'Past due · late work accepted',cls:'late'};
  return {label:'Open',cls:'gc'};
}
function postDatesText(p){
  var bits=[];
  if(p.start)bits.push('Opens '+fmtDay(p.start));
  bits.push(p.due?'Due '+fmtDay(p.due)+' (end of day)':'No due date');
  return bits.join(' · ');
}

/* Class insights from everyone's boards (submitted or in progress). */

  r.students.forEach(function(s){

    s.conns.forEach(function(c){var ab=c.pair.split('-').map(Number);ab.forEach(function(x){if(x<1000)seen[x]=1});pairs[c.pair]=(pairs[c.pair]||0)+1;reasons.push(c.why);});
    Object.keys(seen).forEach(function(x){use[x]=(use[x]||0)+1});
  });
  var label=function(x){x=Number(x);if(x>=1000){var k=r.act.dc[x-1000];var d=DC.find(function(z){return z.k===k});return d?d.name:'Icon'}var t=byId[x];return t?t.term:'T'+x;};
  var top=Object.keys(pairs).sort(function(x,y){return pairs[y]-pairs[x]}).slice(0,8).map(function(k){var ab=k.split('-');return {a:label(ab[0]),b:label(ab[1]),n:pairs[k]}});
